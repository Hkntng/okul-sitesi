<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karışık Tekrar — 8. Sınıf Matematik</title>
<meta name="description" content="12 konudan karışık sorularla kendini test et. Araştırmalar karışık tekrarın en kalıcı öğrenme yolu olduğunu gösteriyor.">
<meta property="og:title" content="Karışık Tekrar — 8. Sınıf Matematik">
<meta property="og:description" content="12 konudan karışık soru: hatırlama alıştırması ile kalıcı öğren.">
<meta property="og:url" content="https://hkntng.github.io/okul-sitesi/karisik-tekrar.html">
<style>
:root{color-scheme:dark}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.55}
.sar{max-width:430px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;margin:10px 0 4px}
.alt-baslik{color:#8b949e;font-size:14px;margin-bottom:18px}
.kart{background:#161d2b;border:1px solid #2c3950;border-radius:14px;padding:18px;margin-bottom:14px}
.rozet{display:inline-block;background:#1f2b3f;color:#7da8d8;font-size:12px;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.soruTxt{font-size:16px;font-weight:600;margin:6px 0 14px}
.sik{display:block;width:100%;box-sizing:border-box;padding:13px;margin-bottom:8px;border-radius:10px;border:1px solid #2c3950;background:#10151f;color:#e6edf3;font-size:15px;cursor:pointer;text-align:left;font-family:inherit}
.sik.dogru{background:#12251a;border-color:#3fb950;color:#8ce89f}
.sik.yanlis{background:#2b1518;border-color:#f85149;color:#ffa198}
.aciklama{display:none;font-size:14px;padding:10px 12px;border-radius:10px;margin-top:6px}
.aciklama.g{display:block;background:#12251a;color:#8ce89f}
.aciklama.k{display:block;background:#2b1518;color:#ffa198}
.ilerle{width:100%;padding:14px;border-radius:12px;border:0;background:#2f81f7;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px}
.ilerle:disabled{opacity:.4;cursor:default}
.skorKutu{text-align:center;padding:30px 18px}
.buyukSkor{font-size:44px;font-weight:800;margin-bottom:6px}
.bar{height:6px;background:#1f2733;border-radius:3px;overflow:hidden;margin:14px 0 22px}
.bar>div{height:100%;background:#2f81f7;transition:width .3s}
a{color:#7da8d8}
.nav{display:flex;justify-content:space-between;margin-top:26px;font-size:14px}
.nav a{text-decoration:none}
</style>
<link rel="icon" href="/okul-sitesi/icons/icon-192.png">
<link rel="canonical" href="https://hkntng.github.io/okul-sitesi/karisik-tekrar.html">
<link rel="manifest" href="/okul-sitesi/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/okul-sitesi/icons/icon-192.png">
<meta name="theme-color" content="#070b16">
</head>
<body>
<div class="sar">
  <h1>🔀 Karışık Tekrar</h1>
  <div class="alt-baslik">12 konudan rastgele 8 soru. Araştırmalara göre karışık tekrar, tek konuyu üst üste çözmekten çok daha kalıcı öğrenme sağlar.<br><span style="font-size:12px">Kaynak: <a href="https://pdf.retrievalpractice.org/SpacingGuide.pdf" target="_blank" rel="noopener">retrievalpractice.org</a> · Cepeda vd. (2006)</span></div>
  <div class="bar"><div id="bar" style="width:0%"></div></div>
  <div id="alan"></div>
  <div class="nav"><a href="index.html">← Ana sayfa</a><a href="#" onclick="location.reload();return false">↺ Yeni set</a></div>
</div>
<script src="/okul-sitesi/soru-bankasi.js"></script>
<script>
(function(){
var BANKA=window.SORU_BANKASI;
// Karıştır, 8 soru seç, şıkları da karıştır
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var sorular=shuf(BANKA.slice()).slice(0,8).map(function(q){
  var idx=shuf(q.c.map(function(_,i){return i}));
  return {k:q.k,s:q.s,c:idx.map(function(i){return q.c[i]}),d:idx.indexOf(q.d),a:q.a};
});
var i=0, dogru=0, yanlisKonular={}, alan=document.getElementById('alan'), bar=document.getElementById('bar');
var KONU_SAYFA={"Çarpanlar":"1-carpanlar.html","Üslü İfadeler":"uslu-ifadeler.html","Karekök":"karekok.html","Veri Analizi":"veri-analizi.html","Olasılık":"olasilik.html","Cebir":"cebir.html","Denklemler":"denklemler.html","Eşitsizlikler":"esitsizlikler.html","Üçgenler":"ucgenler.html","Benzerlik":"benzerlik.html","Dönüşüm":"donusum.html","Cisimler":"cisimler.html"};
function goster(){
  bar.style.width=(i/sorular.length*100)+'%';
  if(i>=sorular.length){ return bitir(); }
  var q=sorular[i], h='<div class="kart"><span class="rozet">'+q.k+' · '+(i+1)+'/'+sorular.length+'</span>';
  h+='<div class="soruTxt">'+q.s+'</div>';
  q.c.forEach(function(c,j){ h+='<button class="sik" data-j="'+j+'">'+c+'</button>'; });
  h+='<div class="aciklama" id="ac"></div>';
  h+='<button class="ilerle" id="devam" disabled>Sonraki soru →</button></div>';
  alan.innerHTML=h;
  Array.prototype.forEach.call(alan.querySelectorAll('.sik'),function(b){
    b.onclick=function(){
      if(document.getElementById('devam').disabled===false) return;
      var j=+b.getAttribute('data-j'), ac=document.getElementById('ac');
      Array.prototype.forEach.call(alan.querySelectorAll('.sik'),function(x,xi){
        if(xi===q.d) x.classList.add('dogru');
      });
      if(j===q.d){ dogru++; ac.className='aciklama g'; ac.textContent='✓ Doğru! '+q.a; if(window.kutudanCikar) window.kutudanCikar(q); }
      else { b.classList.add('yanlis'); ac.className='aciklama k'; ac.textContent='✗ '+q.a; yanlisKonular[q.k]=1; if(window.kutuyaEkle) window.kutuyaEkle(q); }
      document.getElementById('devam').disabled=false;
    };
  });
  document.getElementById('devam').onclick=function(){ i++; goster(); };
}
function bitir(){
  bar.style.width='100%';
  var yuzde=Math.round(dogru/sorular.length*100);
  var msg = yuzde>=80 ? 'Harika! Konulara hâkimsin.' : yuzde>=50 ? 'İyi gidiyorsun — yanlış yaptığın konuların sayfalarına dön.' : 'Sorun değil: yanlışların açıklamalarını oku, konu sayfalarını tekrar et, yarın yeni set çöz.';
  try{
    var g=JSON.parse(localStorage.getItem('karisikSkorlar')||'[]');
    g.push({t:Date.now(),d:dogru,n:sorular.length});
    localStorage.setItem('karisikSkorlar',JSON.stringify(g.slice(-20)));
    var son=g.slice(-5).map(function(x){return x.d+'/'+x.n}).join(' · ');
  }catch(e){ var son=''; }
  var yk=Object.keys(yanlisKonular), tekrarH='';
  if(yk.length){
    tekrarH='<div style="margin-top:16px;text-align:left"><div style="font-size:13px;font-weight:600;color:#f0b429;margin-bottom:8px">📌 Bu konulara geri dön:</div>'+
      yk.map(function(k){var u=KONU_SAYFA[k];return u?'<a href="'+u+'" style="display:block;padding:10px 12px;margin-bottom:6px;border:1px solid #2c3950;border-radius:10px;color:#79c0ff;text-decoration:none;font-size:14px">→ '+k+'</a>':'';}).join('')+'</div>';
  }
  alan.innerHTML='<div class="kart skorKutu"><div class="buyukSkor">'+dogru+'/'+sorular.length+'</div><div>'+msg+'</div>'+tekrarH+(son?'<div style="margin-top:14px;font-size:13px;color:#8b949e">Son denemeler: '+son+'</div>':'')+'<button class="ilerle" onclick="location.reload()" style="margin-top:18px">↺ Yeni karışık set</button></div>';
}
goster();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/okul-sitesi/sw.js', {scope: '/okul-sitesi/'});
}
</script>
</body>
</html>
