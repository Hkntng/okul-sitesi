<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="https://cdnvideo.eba.gov.tr/eba-v4-arayuz/img/favicon.ico">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
	
    <title>Taşındık</title>

	<style>
        body {font-family: Poppins, serif;}
        .content-area {
            color: #FFFFFF;
            background-color: #7C4DFF;
            padding: 200px 100px;
            height: 100vh;
        }
        .second-part {margin: 100px 0;}
        .btn-orange {
            font-size: 20px;
            color: #FFF;
            padding: 5px 20px;
            background-color: #EF6C00;
            margin: 20px 0 30px 0;
        }
        .btn-orange:hover {
            box-shadow: 0 0 15px #a24301;
            transition: 0.3s;
        }
        @media(max-width: 576px) {
            .content-area {padding: 100px 20px;}
            .second-part {margin: 50px 0;}
        }
	</style>

<style>
:root { --bg-dark:#0b101e; --bg-light:#fafafa; --text-dark:#e8edf7; --text-light:#111; --accent:#a3e635; }
body.light { background:var(--bg-light); color:var(--text-light); }
body.light .kart { background:#fff; border-color:#ddd; color:#111; }
body.light .adim { background:#a3e635; color:#0b101e; }
body.light button { background:#a3e635; color:#0b101e; }
body.light .sekme.secili { background:#a3e635; color:#fff; }
body.light .sonuc { background:#fff; border-color:#ddd; color:#111; }
body.light .secenek { background:#fff; border-color:#ddd; color:#111; }
body.light .sekme { background:#fff; border-color:#ddd; color:#111; }
body.light .sekme:active { background:#a3e635; }
</style>

</head>

<body>
    <div style="background-color: #895eff;">
        <div class="container">
            <div class="content-area">
                <div class="fs-2 fw-bold">Taşındık!</div>
                <div class="second-part">
                    <img src="img-tasindik.png" class="w-100 h-100">
                    <div style="margin-bottom: 20px">Bizi ve sunduğumuz tüm içerikleri</br>artık EBA'da bulabilirsin.</div>
                    <a href="https://eba.gov.tr" class="btn-orange rounded-pill text-decoration-none">EBA'ya Git</a>
                </div>
            </div>
        </div>
    </div>

<script>
// Theme toggle
function toggleTheme() {
  document.body.classList.toggle('light');
  localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
// Init theme from storage
window.addEventListener('load', function() {
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
});
// Note-taking
function saveNote() {
  const txt = document.getElementById('notInput').value.trim();
  if (txt) {
    const notes = JSON.parse(localStorage.getItem('pageNotes') || '[]');
    notes.push({page: location.pathname, text: txt, time: new Date().toISOString()});
    localStorage.setItem('pageNotes', JSON.stringify(notes));
    showNotes();
    document.getElementById('notInput').value = '';
  }
}
function clearNotes() {
  if (window.confirm('Notları silmek istediğinizden emin misiniz?')) {
    localStorage.removeItem('pageNotes');
    showNotes();
  }
}
function showNotes() {
  const container = document.getElementById('notGoster');
  container.innerHTML = '';
  const notes = JSON.parse(localStorage.getItem('pageNotes') || '[]');
  const pageNotes = notes.filter(n => n.page === location.pathname);
  if (pageNotes.length === 0) {
    container.innerHTML = '<i>Henüz not yok.</i>';
    return;
  }
  const ul = document.createElement('ul');
  pageNotes.forEach((n, idx) => {
    const li = document.createElement('li');
    li.innerHTML = `<strong>${new Date(n.time).toLocaleString()}</strong>: ${n.text}`;
    ul.appendChild(li);
  });
  container.appendChild(ul);
}
window.addEventListener('load', showNotes);
</script>


<div class="kart" style="margin-top:20px;">
  <span class="adim">Tema</span>
  <button onclick="toggleTheme()" style="margin-top:5px;">🌙/☀️ Tema Değiştir</button>
</div>
<div class="kart" style="margin-top:20px;">
  <span class="adim">Not Defteri</span>
  <textarea id="notInput" rows="2" placeholder="Bir not yazın..." style="width:100%;box-sizing:border-box;margin-top:5px;"></textarea>
  <div style="margin-top:8px;">
    <button id="saveNote" onclick="saveNote()" style="margin-right:5px;">Kaydet</button>
    <button id="clearNote" onclick="clearNotes()">Sil</button>
  </div>
  <div id="notGoster" style="margin-top:10px;font-size:0.9em;color:#8b95ad;"></div>
</div>
<div class="kart" style="margin-top:20px;">
  <span class="adim">Gerçek Hayat Örneği</span>
  <p>tegmm konusuyla ilgili gerçek‑hayat örnekleri burada yer alabilir.</p>
</div>

</body>
